version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: ronaldo-dockpeek_dockpeek_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
  dockpeek:
    image: dockpeek/dockpeek:latest
    init: true
    restart: unless-stopped
    environment:
      SECRET_KEY: "${APP_SEED}"
      USERNAME: "umbrel"
      PASSWORD: "${APP_PASSWORD}"
      DOCKER_HOST: "tcp://socket-proxy:2375"
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_COUNT: "1"
    depends_on:
      - socket-proxy
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      PING: "1"
      VERSION: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
