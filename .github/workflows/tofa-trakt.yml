name: Build Tofa Trakt
on:
  push:
    paths:
      - 'ronaldo-tofa-trakt/app/**'
      - '.github/workflows/tofa-trakt.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ronaldo-tofa-trakt/app/requirements.txt
      - run: python -m unittest discover -s ronaldo-tofa-trakt/app -p 'test_*.py'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ronaldo-tofa-trakt/app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/ronaldoamd9/tofa-trakt:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
