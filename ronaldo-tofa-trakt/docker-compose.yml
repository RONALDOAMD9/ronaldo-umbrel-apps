version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: ronaldo-tofa-trakt_server_1
      APP_PORT: 8787
  server:
    image: ghcr.io/ronaldoamd9/tofa-trakt:1.0.2@sha256:b4c44ad6fd13cbe5a4496300de69bcc30fb84c7f9075fabd9cf4a63a007239d8
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      TOFA_URL: http://host.docker.internal:33333
      TRAKT_CLIENT_ID: cwgakpOPSKq-BD8yp1S6IDriLJIQjO0wgWYRU-xuX-8
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
