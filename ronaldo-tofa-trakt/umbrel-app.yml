releaseNotes: >-
  Migração automática da ponte avulsa anterior, com backup privado das
  autorizações e controle de envios. Recupera a reprodução em andamento
  após reiniciar o aplicativo. Corrige as permissões da pasta privada
  durante a reinicialização e verifica a saúde da interface.
