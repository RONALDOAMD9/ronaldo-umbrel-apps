version: "3.7"
services:
  server:
    image: ghcr.io/tofatv/tofa:beta
    init: true
    restart: unless-stopped
    network_mode: host
    # GPU Intel integrada: aceleracao de video por hardware.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Videos:/media:ro
